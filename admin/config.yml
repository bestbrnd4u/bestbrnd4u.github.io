backend:
  name: github
  repo: bestbrnd4u/bestbrnd4u.github.io
  branch: main
  # Netlify виступає лише як безкоштовний OAuth-проксі для GitHub —
  # сам сайт при цьому продовжує жити на GitHub Pages, без Netlify-хостингу.
  base_url: https://api.netlify.com
  auth_endpoint: auth

# зберігання завантажених фото (можна або завантажити файл,
# або просто вставити зовнішнє посилання — обидва варіанти працюють
# в полі "Фотографії" нижче)
media_folder: "assets/images/products/uploads"
public_folder: "/assets/images/products/uploads"

publish_mode: simple

collections:
  - name: "pages"
    label: "Сторінки"
    files:
      - name: "home"
        label: "Головна сторінка"
        file: "data/home.json"
        description: "Вміст головної сторінки сайту (index.html) — заголовок, банери, категорії, бренди, переваги. Розділ «Популярні товари» сюди не входить — він завжди підтягується автоматично з каталогу."
        fields:
          - label: "Порядок блоків на головній"
            name: "sectionsOrder"
            widget: "list"
            required: false
            summary: "{{fields.section}}"
            hint: >
              Перетягніть рядки (за іконку зліва), щоб змінити порядок
              блоків на головній сторінці. Головний банер зверху і форма
              підписки внизу порядком не керуються — вони завжди перший і
              останній. Якщо якийсь блок прибрати з цього списку — він не
              зникне із сайту, а лишиться на своєму місці за замовчуванням.
            field:
              label: "Блок"
              name: "section"
              widget: "select"
              options:
                - { label: "Слайдер акцій (якщо увімкнений)", value: "promo-hero-slider" }
                - { label: "Instagram", value: "instagram" }
                - { label: "Популярні категорії", value: "categories" }
                - { label: "Акції (маленькі картки)", value: "promotions" }
                - { label: "Банер акції на всю ширину + товари", value: "brand-campaigns" }
                - { label: "Компактні банери брендів", value: "brand-teasers" }
                - { label: "Колекції", value: "collections" }
                - { label: "Промо-банер", value: "promo-banner" }
                - { label: "Бренди", value: "brands" }
                - { label: "Популярні товари", value: "popular-products" }
                - { label: "Переваги магазину", value: "advantages" }

            # значення видно одразу — у згорнутому вигляді
            # показувалась лише назва поля, а не вміст
            collapsed: false
          - label: "Головний банер (hero)"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - label: "Маленький підпис зверху"
                name: "label"
                widget: "string"
                required: false
                hint: "Наприклад: Нова колекція 2026"

              - label: "Заголовок"
                name: "heading"
                widget: "text"
                required: true
                hint: "Кожен рядок — з нового рядка, так вони й розіб'ються на екрані"

              - label: "Опис"
                name: "text"
                widget: "text"
                required: true

              - label: "Фонове фото"
                name: "image"
                widget: "image"
                required: true
                choose_url: true
                media_folder: "/assets/images/banners"
                public_folder: "/assets/images/banners"
                # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
                #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
                #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
                hint: >
                  Завантажте: 2400×1600 (3:2). Найбільший розкид обрізки на
                  сайті — на десктопі широка смуга, на мобільному майже
                  портрет. Беріть фон-текстуру чи загальний план БЕЗ
                  дрібних деталей і без тексту на самому фото — зверху
                  ляже темна заливка та білий заголовок.

              - label: "Кнопка 1 — текст"
                name: "primaryButtonText"
                widget: "string"
                required: true

              - label: "Кнопка 1 — посилання"
                name: "primaryButtonLink"
                widget: "string"
                required: true
                hint: "Наприклад: catalog.html"

              - label: "Кнопка 2 — текст"
                name: "secondaryButtonText"
                widget: "string"
                required: false

              - label: "Кнопка 2 — посилання"
                name: "secondaryButtonLink"
                widget: "string"
                required: false
                hint: "Наприклад: #products"

          - label: "Блок \"Instagram\""
            name: "instagram"
            widget: "object"
            collapsed: true
            fields:
              - label: "Заголовок"
                name: "title"
                widget: "string"
                required: true

              - label: "Текст"
                name: "text"
                widget: "string"
                required: true

              - label: "Текст кнопки"
                name: "buttonText"
                widget: "string"
                required: true

              - label: "Посилання на Instagram"
                name: "link"
                widget: "string"
                required: true

          - label: "Блок \"Популярні категорії\""
            name: "categories"
            widget: "object"
            collapsed: true
            fields:
              - label: "Заголовок розділу"
                name: "title"
                widget: "string"
                required: true

              - label: "Категорії"
                name: "items"
                widget: "list"
                required: true
                summary: "{{fields.label}}"
                fields:
                  - label: "Назва"
                    name: "label"
                    widget: "string"
                    required: true

                  - label: "Фото"
                    name: "image"
                    widget: "image"
                    required: true
                    choose_url: true
                    hint: >
                      Завантажте: 800×660 (1.2:1). Найпередбачуваніший блок
                      на сайті — десктоп і мобільний обрізають майже
                      однаково, можна не думати про обрізку.

                  - label: "Посилання"
                    name: "link"
                    widget: "string"
                    required: true
                    hint: "Наприклад: catalog.html?gender=Жінкам"

          - label: "Промо-банер"
            name: "promo"
            widget: "object"
            collapsed: true
            fields:
              - label: "Маленький підпис зверху"
                name: "label"
                widget: "string"
                required: false

              - label: "Заголовок"
                name: "heading"
                widget: "string"
                required: true

              - label: "Опис"
                name: "text"
                widget: "text"
                required: true

              - label: "Фонове фото"
                name: "image"
                widget: "image"
                required: true
                choose_url: true
                media_folder: "/assets/images/banners"
                public_folder: "/assets/images/banners"
                # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
                #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
                #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
                hint: >
                  Завантажте: 2000×1600 (5:4). Як і в hero — великий розкид
                  обрізки між десктопом і мобільним, тож беріть фон-текстуру
                  чи загальний план без дрібних деталей і без тексту на
                  самому фото.

              - label: "Текст кнопки"
                name: "buttonText"
                widget: "string"
                required: true

              - label: "Посилання кнопки"
                name: "buttonLink"
                widget: "string"
                required: true

          - label: "Блок \"Популярні бренди\""
            name: "brands"
            widget: "object"
            collapsed: true
            fields:
              - label: "Заголовок розділу"
                name: "title"
                widget: "string"
                required: true

              - label: "Бренди"
                name: "items"
                widget: "list"
                required: true
                summary: "{{fields.name}}"
                fields:
                  - label: "Назва бренду"
                    name: "name"
                    widget: "string"
                    required: true

                  - label: "Посилання"
                    name: "link"
                    widget: "string"
                    required: true
                    hint: "Наприклад: catalog.html?brand=Guess"

          - label: "Блок \"Переваги\""
            name: "advantages"
            widget: "list"
            required: true
            summary: "{{fields.title}}"
            fields:
              - label: "Іконка (емодзі)"
                name: "icon"
                widget: "string"
                required: true
                hint: "Наприклад: 🚚"

              - label: "Заголовок"
                name: "title"
                widget: "string"
                required: true

              - label: "Опис"
                name: "text"
                widget: "string"
                required: true

  - name: "promoPopups"
    label: "Спливаючі банери"
    label_singular: "Спливаючий банер"
    description: >
      Невеличкий банер, що спливає в кутку екрана (як на md-fashion.ua) —
      привертає увагу до акції. З'являється один раз на сторінці (за
      замовчуванням через 60 секунд), і якщо відвідувач його закрив —
      повторно вже не покажеться. Клік по банеру веде на сторінку акції.
    folder: "data/promo-popups"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - label: "Показувати банер"
        name: "active"
        widget: "boolean"
        default: true

      - label: "Назва (лише для адмінки)"
        name: "title"
        widget: "string"
        required: true
        hint: "Ніде на сайті не показується — потрібна лише щоб впізнати банер у списку"

      - label: "Зображення банера"
        name: "image"
        widget: "image"
        required: true
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          Завантажте: 800×800 (1:1) — строго квадрат, тут обрізка
          однакова на будь-якому екрані.

      - label: "Акція, на яку веде клік"
        name: "promoSlug"
        widget: "relation"
        collection: "promotions"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: true
        hint: >
          Оберіть акцію зі списку «Акції». При кліку на банер відвідувач
          потрапить на сторінку саме цієї акції з товарами, фільтрами
          та сортуванням.

      - label: "На яких сторінках показувати"
        name: "pages"
        widget: "select"
        multiple: true
        required: true
        default: ["catalog", "promo"]
        options:
          - { label: "Каталог", value: "catalog" }
          - { label: "Сторінка будь-якої акції", value: "promo" }
          - { label: "Головна сторінка", value: "home" }
        hint: "Можна обрати декілька"

      - label: "Через скільки секунд показати"
        name: "delaySeconds"
        widget: "number"
        value_type: "int"
        default: 60
        required: false
        hint: "За замовчуванням — 60 (через хвилину після того, як відвідувач відкрив сторінку)"

  - name: "promotions"
    label: "Акції"
    label_singular: "Акція"
    description: >
      Картки акцій на головній сторінці (розділ «Акції»), схожі на банери
      знижок на md-fashion.ua. Кожна акція — окремий файл. Вимкнути акцію,
      не видаляючи її, можна перемикачем «Показувати на сайті».
    folder: "data/promotions"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}} — {{fields.badge}}"
    view_groups:
      - label: "Тип показу"
        field: "displayType"
    sortable_fields: ["order", "title"]
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    fields:
      - label: "Показувати на сайті"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Вимкніть, щоб приховати акцію, не видаляючи файл"

      - label: "Спосіб показу на головній"
        name: "displayType"
        widget: "select"
        default: "card"
        options:
          - { label: "Маленька картка в сітці «Акції»", value: "card" }
          - { label: "Слайдер на всю ширину сторінки (вгорі, під головним банером)", value: "hero_slider" }
          - { label: "Великий банер на всю ширину + товари під ним", value: "banner_products" }
          - { label: "Компактний банер бренду (фото + короткий текст, без товарів)", value: "banner_compact" }
        hint: >
          "Маленька картка" — звичайна картка в сітці «Акції» (як зараз).
          "Слайдер на всю ширину" — великий банер вгорі сторінки, під
          головним слайдом, з кнопками "Жінкам/Чоловікам/Дітям" і стрілками
          гортання — якщо таких акцій кілька, вони гортаються по черзі в
          одному банері (як на md-fashion.ua). "Великий банер" — фото +
          текст на всю ширину і ряд товарів під ним, як банер GANT на
          md-fashion.ua. "Компактний банер" — менший банер бренду з фото
          та коротким текстом, без товарів під ним — зручно для швидких
          тизерів колекції.

      - label: "Порядок показу"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "Менше число — вище на сторінці"

      - label: "Бейдж"
        name: "badge"
        widget: "string"
        required: false
        hint: "Наприклад: -50% або NEW"

      - label: "Заголовок"
        name: "title"
        widget: "string"
        required: true
        hint: "Наприклад: SUMMER SALE до -50%"

      - label: "Опис"
        name: "text"
        widget: "string"
        required: true
        hint: "Наприклад: Marc Jacobs, Michael Kors, Coach та інші"

      - label: "Фото"
        name: "image"
        widget: "image"
        required: true
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          Це фото — ПРЕВʼЮ на головній сторінці. Потрібний розмір
          залежить від «Способу показу» вище — беріть саме той рядок:
          • Слайдер на всю ширину (hero_slider) — 1000×1160 (≈5:6,
          вертикальне). Фото займає праву половину слайда, обрізається
          знизу; головне тримайте вгорі кадру.
          • Великий банер + товари (banner_products) — 1800×900 (2:1).
          Зверху ляже темна заливка й білий заголовок.
          • Компактний банер бренду (banner_compact) — 800×1000 (4:5),
          обрізається від ВЕРХУ кадру.
          • Маленька картка — 1200×1500 (4:5).
          БЕЗ тексту, кнопок і стрілок на самому фото: підпис, кнопки
          статей і стрілки слайдера сайт малює сам поверх картинки —
          намальовані на фото дублюються і виглядають як брак.
          Для банера самої сторінки акції (коли натиснути «Дивитись усі
          товари») є ОКРЕМЕ поле нижче — це фото туди не потрапляє.

      - label: "Фото для мобільної версії (необов'язково)"
        name: "imageMobile"
        widget: "image"
        required: false
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          Потрібний розмір залежить від «Способу показу» вище:
          • Слайдер на всю ширину — 1200×900 (4:3);
          • Великий банер + товари — 1200×900 (4:3);
          • Компактний банер бренду — 1200×900 (4:3);
          • Маленька картка — 1200×1500 (4:5).
          На вузькому екрані блок акції перебудовується в один стовпчик,
          і фото стає ГОРИЗОНТАЛЬНОЮ смугою над текстом — вертикальний
          кадр там показує лише вузький шматок посередині.
          Банер акції показується на весь екран з cover-заповненням (без
          сірих/порожніх полів по краях), тому на вузькому мобільному екрані
          широке фото і на широкому десктопі вертикальне фото обрізаються
          по-різному. Пропорції залежать від «Способу показу» вище — див.
          підказку до поля «Фото». Якщо на фото є важливі деталі чи текст,
          які не мають зникати при обрізанні — завантажте тут окремий,
          вертикальніший варіант спеціально під мобільні екрани, приблизно
          на місце співвідношення 4:5 (напр. 1200×1500). Якщо лишити
          порожнім, на мобільному використається те саме фото, що й вище.

      # -------------------------
      # Фото для банера НА СТОРІНЦІ САМОЇ АКЦІЇ (коли натиснути "Дивитись
      # усі товари" — окрема сторінка promo.html) — НАВМИСНО окреме поле,
      # а не те саме фото, що вище.
      #
      # Причина: фото вище показується ПРЕВʼЮ на головній, де пропорції
      # залежать від "Способу показу" (напр. компактний банер бренду —
      # вертикальний 4:5). А банер на сторінці акції завжди широка смуга
      # 3.2:1. Одне фото не може добре вкластися в обидва формати
      # одночасно — звідси й обрізка, яку було видно на прикладі
      # Calvin Klein: вертикальний портретний кадр, розтягнутий у
      # вузьку горизонтальну смугу, показував лише випадковий шматок
      # посередині.
      # -------------------------
      - label: "Фото на сторінці акції (необов'язково)"
        name: "promoPageImage"
        widget: "image"
        required: false
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          Банер угорі окремої сторінки цієї акції (там, куди веде кнопка
          "Дивитись усі товари") — широка горизонтальна смуга на весь
          екран, зовсім інші пропорції, ніж у прев'ю на головній вище.
          Завантажте: 1920×600 (≈3.2:1). Якщо лишити порожнім — банер
          покаже те саме фото, що й прев'ю на головній (може обрізатись
          невдало, якщо те фото вертикальне чи квадратне).
          Беріть фон-текстуру чи загальний план без дрібних деталей і
          БЕЗ тексту на самому фото — зверху ляже темна заливка та
          білий заголовок.

      - label: "Фото на сторінці акції для мобільної версії (необов'язково)"
        name: "promoPageImageMobile"
        widget: "image"
        required: false
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          Той самий банер, але для вузького мобільного екрана — там він
          показується вертикальнішим (портрет), тож широке фото вище
          обрізається з боків. Завантажте: 1080×1400 (≈3:4). Порожнє
          поле — на мобільному використається фото з поля вище
          (можливо, з сильнішою обрізкою країв).

      - label: "Текст кнопки"
        name: "buttonText"
        widget: "string"
        required: true
        default: "Дивитись усі товари"

      - label: "Посилання кнопки на сторінці акції"
        name: "link"
        widget: "string"
        required: true
        hint: >
          Куди веде кнопка "Дивитись усі товари" на сторінці самої акції.
          Наприклад: catalog.html?section=sale. Картка на головній сторінці
          завжди веде на окрему сторінку цієї акції автоматично.

      - label: "Бренд, який бере участь в акції"
        name: "brand"
        widget: "string"
        required: false
        hint: >
          Необов'язково. Якщо вказати бренд (наприклад: Guess) — усі товари
          цього бренду автоматично покажуться на сторінці акції, навіть
          якщо їх не додано нижче вручну.

      - label: "Знижка за замовчуванням, %"
        name: "discountPercent"
        widget: "number"
        value_type: "int"
        required: false
        hint: >
          Наприклад: 30. Показується як позначка на товарах з цієї акції,
          якщо в самого товару не вказана своя ціна зі знижкою.

      - label: "Кнопки розділів під банером (лише для «Слайдер на всю ширину»)"
        name: "genderButtons"
        widget: "list"
        required: false
        summary: "{{fields.gender}}"
        hint: >
          Кнопки-шорткати під заголовком банера (як "Жінкам"/"Чоловікам"/
          "Дітям" на md-fashion.ua) — стосується лише "Слайдер на всю
          ширину сторінки" вище. Порядок у списку = порядок кнопок на
          сайті (перетягуйте, щоб поміняти місцями). Можна прибрати
          будь-яку кнопку, додати кілька разів "Унісекс" або залишити
          список порожнім — тоді покажуться стандартні "Жінкам/Чоловікам/
          Дітям". Кожна кнопка веде на сторінку саме цієї акції,
          відфільтровану під обрану стать.
        fields:
          - label: "Розділ"
            name: "gender"
            widget: "select"
            options: ["Жінкам", "Чоловікам", "Дітям", "Унісекс"]

          - label: "Колір кнопки"
            name: "color"
            widget: "color"
            required: false
            default: "#111827"
            hint: "Не обов'язково — за замовчуванням темний, як зараз"

      - label: "Товари цієї акції"
        name: "products"
        widget: "productPicker"
        required: false
        hint: >
          Почніть вводити назву, бренд, категорію або артикул. Пошук
          звичайний, як Ctrl+F: показує лише те, де запит справді
          зустрічається, а якщо збігів немає — так і пише, замість
          вивалювати весь каталог. Кілька слів через пробіл звужують
          пошук («coach tabby»). Не обов'язково, якщо вище вказано
          бренд — тоді досить і цього.

  - name: "collections"
    label: "Добірки"
    label_singular: "Добірка"
    description: >
      Редакційні добірки товарів на головній сторінці — велике фото зліва
      і кілька товарів справа з гортанням стрілками (як блоки "Добірка" на
      md-fashion.ua). Кожна добірка — окремий файл.
    folder: "data/collections"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    fields:
      - label: "Показувати на сайті"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Вимкніть, щоб приховати добірку, не видаляючи файл"

      - label: "Порядок показу"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "Менше число — вище на сторінці"

      - label: "Надпис над заголовком"
        name: "eyebrow"
        widget: "string"
        default: "ДОБІРКА"
        required: false

      - label: "Заголовок"
        name: "title"
        widget: "string"
        required: true
        hint: "Наприклад: Сумки для твого літа"

      - label: "Велике фото зліва"
        name: "image"
        widget: "image"
        required: true
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          Фото для ДЕСКТОПА. Завантажте: 900×1200 (3:4, вертикальне) —
          там воно стоїть вузькою колонкою зліва й тягнеться на всю
          висоту блоку з товарами. Головне тримайте у верхній частині
          кадру: якщо товарів у добірці мало, колонка нижча і низ
          обрізається.

      - label: "Фото для мобільної версії (необов'язково)"
        name: "imageMobile"
        widget: "image"
        required: false
        choose_url: true
        media_folder: "/assets/images/banners"
        public_folder: "/assets/images/banners"
        # Банери живуть окремо від фото товарів: у них своя, широка геометрія, і
        #  скрипт приведення до 4:5 їх не чіпає. Без цього рядка медіатека цього поля
        #  відкривалась на теці фото товарів, і вже вибраний банер у ній не знаходився.
        hint: >
          На вузькому екрані блок перебудовується: фото стає широкою
          смугою НАД товарами, 16:9. Вертикальне фото з поля вище там
          обрізається згори й знизу і показує лише вузький шматок
          посередині. Завантажте: 1600×900 (16:9). Якщо лишити
          порожнім — на мобільному візьметься фото з поля вище.

      - label: "Текст-опис фото (alt)"
        name: "imageAlt"
        widget: "string"
        required: false

      - label: "Товари в добірці"
        name: "products"
        widget: "productPicker"
        required: true
        hint: >
          Почніть вводити назву, бренд, категорію або артикул — пошук
          показує лише справжні збіги. На сайті товари виводяться в тому
          порядку, в якому додані тут: по 3 за раз, далі стрілками.

  - name: "categories"
    label: "Категорії"
    label_singular: "Категорія"
    description: >
      Розділи та підкатегорії каталогу. Додана тут категорія одразу зʼявиться
      у списку вибору при заповненні товару, а в меню сайту й фільтрах
      каталогу — щойно з'явиться хоча б один товар цієї категорії.
    folder: "data/categories"
    create: true
    delete: true
    search: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{department}} — {{name}}"
    sortable_fields: ["department", "name"]
    view_groups:
      - label: "За розділом"
        field: department
    view_filters:
      - label: "Сумки"
        field: department
        pattern: "Сумки"
      - label: "Одяг"
        field: department
        pattern: "Одяг"
      - label: "Взуття"
        field: department
        pattern: "Взуття"
      - label: "Аксесуари"
        field: department
        pattern: "Аксесуари"
      - label: "Білизна"
        field: department
        pattern: "Білизна"
      - label: "Спорт"
        field: department
        pattern: "Спорт"
    fields:
      - label: "Назва категорії"
        name: "name"
        widget: "string"
        required: true
        hint: "Наприклад: Кросівки. Саме ця назва показується покупцям."

      - label: "Розділ"
        name: "department"
        widget: "select"
        required: true
        hint: "До якого великого розділу належить категорія"
        options:
          - "Сумки"
          - "Одяг"
          - "Взуття"
          - "Аксесуари"
          - "Білизна"
          - "Спорт"

  # -------------------------
  # Розміри: які розміри доступні для яких категорій + таблиця
  # розмірів на сторінці товару. Читається сайтом напряму з
  # data/size-groups.json (без перезбірки).
  # -------------------------
  - name: sizeGroups
    label: Розміри
    description: Які розміри доступні для яких категорій товару і що показувати в «Таблиці розмірів»
      на сторінці товару. Зміни застосовуються автоматично — у фільтрі «Розмір» у каталозі та в таблиці
      розмірів. Одна група = один блок розмірів (напр. Сумки, Взуття, Одяг).
    files:
    - name: sizeGroups
      label: Групи розмірів
      file: data/size-groups.json
      format: json
      fields:
      - label: Групи розмірів
        name: groups
        widget: list
        required: true
        summary: '{{fields.title}}'
        fields:
        - label: Технічний ключ
          name: key
          widget: string
          required: true
          hint: 'Латиницею, без пробілів: bags, shoes, clothes. Використовується всередині сайту —
            у вже створених групах не змінюйте.'
        - label: Назва групи
          name: title
          widget: string
          required: true
          hint: 'Заголовок у фільтрі «Розмір» у каталозі. Напр.: Взуття'
        - label: Розділ каталогу
          name: department
          widget: select
          required: false
          options:
          - ''
          - Сумки
          - Одяг
          - Взуття
          - Аксесуари
          - Білизна
          - Спорт
          hint: Якщо вибрати розділ — група автоматично охопить УСІ його категорії, навіть ті, які
            ви додасте пізніше. Тоді список категорій нижче можна не заповнювати.
        - label: Категорії
          name: categories
          widget: list
          required: false
          field:
            label: Категорія
            name: category
            widget: string
          hint: Точні назви категорій, як у розділі «Категорії». Заповнюйте, якщо група охоплює лише
            окремі категорії, а не весь розділ.
          # значення видно одразу — у згорнутому вигляді
          # показувалась лише назва поля, а не вміст
          collapsed: false
        - label: Доступні розміри
          name: sizes
          widget: list
          required: true
          collapsed: false
          hint: >
            Саме ці розміри зʼявляться у фільтрі каталогу для категорій цієї
            групи. Раніше тут був закритий перелік — тепер вписуйте будь-які:
            42, XS, ONESIZE, 39.5. Порядок у списку = порядок у фільтрі.
          field:
            label: Розмір
            name: size
            widget: string
        - label: Текст над таблицею розмірів
          name: guideNote
          widget: text
          required: false
          hint: Показується у вікні «Таблиця розмірів». Якщо порожньо — для цієї групи таблиця не показується,
            а посилання ховається.
        - label: Стовпці таблиці
          name: guideColumns
          widget: list
          required: false
          field:
            label: Назва стовпця
            name: column
            widget: string
          hint: 'Напр. для взуття: Довжина стопи, UK, US. Для сумок: Ширина, Висота, Глибина.'
          # значення видно одразу — у згорнутому вигляді
          # показувалась лише назва поля, а не вміст
          collapsed: false
        - label: Рядки таблиці
          name: guideRows
          widget: list
          required: false
          summary: '{{fields.size}}'
          fields:
          - label: Розмір
            name: size
            widget: string
            required: true
          - label: Значення
            name: values
            widget: list
            required: false
            field:
              label: Значення
              name: value
              widget: string
            hint: У ТОМУ Ж порядку, що й стовпці вище.

            # значення видно одразу — у згорнутому вигляді
            # показувалась лише назва поля, а не вміст
            collapsed: false
  - name: "products"
    label: "Товари"
    label_singular: "Товар"
    description: "Кожен товар — окремий файл. Після збереження товари автоматично збираються в загальний каталог сайту (data/products.json) — це займає близько хвилини."
    folder: "data/products"
    create: true
    delete: true
    search: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{brand}} — {{title}} ({{price}} ₴)"
    sortable_fields: ["title", "brand", "price", "isNew"]
    view_groups:
      - label: "За брендом"
        field: brand
      - label: "За категорією"
        field: category
      - label: "За статтю"
        field: gender
    view_filters:
      - label: "Новинки"
        field: isNew
        pattern: true
      - label: "Зі знижкою"
        field: oldPrice
        pattern: '.+'
      - label: "Жінкам"
        field: gender
        pattern: "Жінкам"
      - label: "Чоловікам"
        field: gender
        pattern: "Чоловікам"
      - label: "Унісекс"
        field: gender
        pattern: "Унісекс"
      - label: "Дітям"
        field: gender
        pattern: "Дітям"
      - label: "⚠️ Опубліковані попри неповні дані"
        field: forcePublish
        pattern: true
    fields:
      - label: "Назва товару"
        name: "title"
        widget: "string"
        required: true
        hint: "Наприклад: Guess Noelle Black"

      - label: "Бренд"
        name: "brand"
        widget: "string"
        required: true

      - label: "Категорія"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["department", "name"]
        required: true
        hint: >
          Список підтягується з розділу «Категорії» в адмінці (ліворуч).
          Не бачите потрібної підкатегорії — додайте нову там, і вона одразу
          зʼявиться тут.

      - label: "Для кого"
        name: "gender"
        widget: "select"
        multiple: true
        required: true
        hint: >
          Можна обрати кілька — товар зʼявиться в кожному з обраних розділів
          каталогу й меню. Товари, створені раніше з однією статтю,
          працюють як раніше.
        options:
          - "Жінкам"
          - "Чоловікам"
          - "Унісекс"
          - "Дітям"
      - label: "Розміри"
        name: "sizes"
        widget: "sizeTags"
        required: false
        hint: >
          Загальні розміри товару — беруться, якщо в конкретного кольору
          нижче розміри не вказані. Обирайте зі списку або впишіть свій
          і натисніть Enter: підказки підтягуються з розділу «Розміри».
      - label: "Ціна, ₴"
        name: "price"
        widget: "number"
        value_type: "int"
        required: true

      - label: "Стара ціна, ₴ (якщо є знижка)"
        name: "oldPrice"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Залиште порожнім, якщо товар без знижки"

      - label: "Позначка на картці"
        name: "badge"
        widget: "select"
        required: false
        options: ["NEW", "SALE", "TOP", "HOT"]
        hint: "Необов'язково — кольоровий лейбл у кутку картки товару"

      - label: "Це новинка?"
        name: "isNew"
        widget: "boolean"
        default: false
        hint: "Впливає на розділ «Новинки» в каталозі"

      - label: "📦 Товар під замовлення"
        name: "preOrder"
        widget: "boolean"
        default: false
        # без цього рядка Decap вважає поле обов'язковим і не дає
        # опублікувати товар, доки перемикач не чіпали руками
        required: false
        hint: >
          Увімкніть, якщо цього товару немає в наявності і його потрібно
          спочатку замовити у постачальника. На сайті замість "В наявності"
          покупець побачить позначку "Під замовлення" з умовами нижче.

      - label: "Термін виготовлення / доставки"
        name: "preOrderDays"
        widget: "string"
        required: false
        default: "5–10 робочих днів"
        hint: "Показується лише якщо увімкнено «Товар під замовлення». Наприклад: 5–10 робочих днів"

      - label: "Розмір передоплати, %"
        name: "preOrderPrepayment"
        widget: "number"
        value_type: "int"
        required: false
        default: 50
        hint: "Наприклад: 50 (означає 50–100% на розсуд продавця — точний текст можна уточнити нижче)"

      - label: "Свій текст умов (необов'язково)"
        name: "preOrderNote"
        widget: "text"
        required: false
        hint: >
          Якщо залишити порожнім — сайт сам складе текст із термінів та
          передоплати вище. Заповніть тут, лише якщо потрібне інше
          формулювання для цього конкретного товару.

      - label: "⚠️ Опублікувати попри неповні дані"
        name: "forcePublish"
        widget: "boolean"
        default: false
        hint: >
          За замовчуванням товар з незаповненими обов'язковими полями
          (категорія, ціна, опис, фото тощо) НЕ показується на сайті —
          лишається тут, в адмінці, поки його не доповнять. Увімкніть цей
          перемикач, якщо потрібно показати товар на сайті прямо зараз,
          навіть з прогалинами в даних.

      - label: "Варіанти кольору"
        name: "variants"
        widget: "list"
        required: true
        hint: "Перший варіант у списку — головний, він показується в каталозі за замовчуванням. При виборі кольору на сайті картинки товару перемикаються на фото цього варіанта."
        summary: "{{fields.color}}"
        fields:
          - label: "Колір (назва)"
            name: "color"
            widget: "string"
            required: true
            hint: "Наприклад: Чорний"

          - label: "Колір (для кружечка-перемикача)"
            name: "hex"
            widget: "color"
            required: true
            hint: "Якщо колір \"мультиколір\" — можна вставити CSS-градієнт замість HEX, наприклад: linear-gradient(90deg,#f87171,#fbbf24,#34d399,#60a5fa)"

          - label: "Артикул цього кольору"
            name: "sku"
            widget: "string"
            required: false
            hint: >
              Артикул саме цього кольору — у різних кольорів однієї моделі
              він зазвичай різний. Якщо залишити порожнім, візьметься
              загальний «Артикул» товару вище (так працюють усі раніше
              додані товари).

          - label: "Розміри цього кольору"
            name: "sizes"
            widget: "sizeTags"
            required: false
            hint: >
              Розміри, у яких є САМЕ цей колір. Наприклад, чорні кросівки
              є в 40–46, а білі лише в 36–39. Якщо залишити порожнім —
              візьмуться загальні «Розміри» товару вище.
              Обирайте зі списку або впишіть свій і натисніть Enter.
          - label: "Фотографії цього кольору"
            name: "images"
            widget: "list"
            required: true
            hint: >
              Перше фото — головне, воно показується в каталозі. Можна
              завантажити файл або вставити посилання на фото.
              Завантажте: 1200×1500 (4:5, вертикальне), мінімум 1000×1250.
              Товар ПО ЦЕНТРУ кадру, зверху й знизу лишайте трохи повітря —
              на телефоні та в мініатюрах фото кадрується у квадрат і
              обрізає верх/низ; впритул до краю — ризик відрізати ручку
              сумки чи інший виступ.
            field:
              label: "Фото"
              name: "image"
              widget: "image"
              required: true
              choose_url: true
              hint: "1200×1500 (4:5), товар по центру з відступами зверху й знизу"

            # значення видно одразу — у згорнутому вигляді
            # показувалась лише назва поля, а не вміст
            collapsed: false
          - label: "Відео цього кольору"
            name: "video"
            widget: "file"
            required: false
            choose_url: true
            hint: >
              Необов'язково. Короткий відео-огляд товару — додається
              останнім слайдом у галереї на сторінці товару, поряд із
              фото. Два варіанти: 1) завантажити файл або вставити пряме
              посилання на .mp4 — підійде, якщо відео вже в сумісному
              форматі; 2) вставити звичайне посилання на YouTube або
              Vimeo — рекомендовано для відео, знятого на iPhone
              (формат .mov з iPhone часто грає лише в Safari, а не в
              Chrome/Firefox; YouTube/Vimeo самі перекодовують відео при
              завантаженні, і воно потім грає скрізь). Завантажити відео
              з iPhone на YouTube/Vimeo можна прямо з телефону через їхній
              застосунок чи сайт.

      - label: "Опис товару"
        name: "description"
        widget: "text"
        required: true

      - label: "Пошукові теги"
        name: "searchKeywords"
        widget: "list"
        required: false
        hint: "Слова, за якими покупці можуть шукати цей товар — не показуються на сайті, лише допомагають пошуку. Додайте синоніми, розмовні назви, варіанти написання. Наприклад: сумка, клатч, кросбоді, шоппер, через плече"

      # -------------------------
      # Блок Instagram під товаром
      # -------------------------
      - label: "Instagram під товаром"
        name: "instagramBlock"
        widget: "select"
        required: false
        default: "general"
        hint: >
          Що показувати блоком Instagram унизу сторінки цього товару.
          «Reels цього товару» — якщо на нього знято окреме відео;
          «Реклама акаунту» — той самий блок, що на головній;
          «Не показувати» — блок ховається повністю.
        options:
          - label: "Реклама нашого акаунту (як на головній)"
            value: "general"
          - label: "Reels саме цього товару"
            value: "reels"
          - label: "Не показувати"
            value: "none"

      - label: "Посилання на Reels"
        name: "instagramReels"
        widget: "string"
        required: false
        hint: >
          Потрібне лише для варіанта «Reels саме цього товару».
          Скопіюйте посилання на Reels з Instagram, напр.
          https://www.instagram.com/reel/AbCdEf123/
          Якщо посилання не вказати — покажеться звичайна реклама акаунту.

      - label: "Матеріал"
        name: "material"
        widget: "string"
        required: false

      - label: "Країна виробник"
        name: "country"
        widget: "string"
        required: false

      - label: "Артикул"
        name: "sku"
        widget: "string"
        required: false
        hint: >
          Загальний артикул товару — береться, якщо в конкретного кольору
          нижче артикул не вказано. Наприклад: 1381912-001

      - label: "Застібка"
        name: "closure"
        widget: "string"
        required: false
        hint: "Наприклад: блискавка, магніт, кнопка"

      - label: "Декор"
        name: "decor"
        widget: "string"
        required: false
        hint: "Наприклад: логотип, металева фурнітура"

      - label: "Розмір (габарити), см"
        name: "dimensions"
        widget: "string"
        required: false
        hint: "Наприклад: 19x23x15 см"

      - label: "Опис ручки/ременя"
        name: "strapInfo"
        widget: "string"
        required: false
        hint: "Повне речення, наприклад: Одна незнімна регульована ручка висотою 50 см"

      - label: "Відділення / кишені (зовнішні)"
        name: "compartments"
        widget: "string"
        required: false
        hint: "Наприклад: одна кишеня"

      - label: "Склад матеріалу"
        name: "composition"
        widget: "string"
        required: false
        hint: "Наприклад: 100% поліестер"

      - label: "Рейтинг"
        name: "rating"
        widget: "number"
        value_type: "float"
        required: false
        default: 5
        min: 1
        max: 5

      - label: "Кількість відгуків"
        name: "reviews"
        widget: "number"
        value_type: "int"
        required: false
        default: 0

      # Технічні поля — не показуються як звичайні інпути,
      # автоматично синхронізуються з першим варіантом кольору
      # скриптом scripts/build-products.js після збереження.
      # НЕ ЧІПАТИ.
      - label: "Колір (службове поле)"
        name: "color"
        widget: "hidden"
        required: false

      - label: "Фотографії (службове поле)"
        name: "images"
        widget: "hidden"
        required: false

      # Технічне поле — не показується як звичайний інпут,
      # використовується сайтом для кошика/обраного.
      # НЕ ЧІПАТИ: заповнюється і зберігається автоматично.
      - label: "ID (службове поле)"
        name: "id"
        widget: "hidden"
        required: false
