<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestBrnd4u — Адмінка</title>
    <link rel="icon" href="../assets/images/favicon.png">
</head>
<body>
    <!-- Плаваюче посилання на інструмент масового імпорту товарів
         (admin/import.html) — Decap CMS не має простого штатного
         способу додати власний пункт меню без збірки плагіна, тому
         додаємо посилання поверх усього і на випадок, якщо Decap
         перемалює <body>, повертаємо його назад через MutationObserver -->
    <script>
    (function () {

        // Свої посилання в адмінці: масовий імпорт і доступи для колег.
        //
        // Місце — у ЛІВОМУ МЕНЮ, під списком розділів.
        // Раніше вони висіли фіксовано в правому нижньому куті й
        // перекривали робочу область на сторінках редагування товару.
        // У меню для них є вільне місце, а в редакторі меню зникає —
        // отже, кнопки самі не показуються там, де мішали.
        //
        // Якщо меню знайти не вдалось (Decap міняв розмітку), лишається
        // запасний варіант — компактна кнопка в лівому нижньому куті,
        // подалі від керування збереженням, яке Decap тримає справа.

        var LINKS = [
            {
                id: "bulkImportLink",
                href: "import.html",
                text: "📥 Масовий імпорт товарів",
                primary: true
            },
            {
                // Навмисно ВЕДЕ НА ІНСТРУКЦІЮ, а не на форму «додати
                // користувача»: вхід в адмінку — це вхід через GitHub,
                // власної бази користувачів у CMS немає. Форма з логіном
                // і паролем нічого б не відкривала, лише створювала
                // хибне враження, що доступ видано.
                id: "accessLink",
                href: "access.html",
                text: "👥 Доступи для колег",
                primary: false
            }
        ];

        // Ліве меню шукаємо СТРУКТУРНО — через посилання на колекції,
        // а не за назвами класів: Decap генерує їх автоматично, і
        // прив'язка до класу зламалась би на будь-якому оновленні.
        function findSidebar() {

            var links = document.querySelectorAll('a[href*="#/collections/"]');

            if (!links.length) return null;

            var node = links[0].parentElement;

            // піднімаємось, доки не знайдемо вузол, що містить УСІ
            // посилання на розділи — це і є контейнер меню
            while (node && node.querySelectorAll('a[href*="#/collections/"]').length < links.length) {
                node = node.parentElement;
            }

            return node;

        }

        function buildBox(inSidebar) {

            var box = document.createElement("div");
            box.id = "customAdminLinks";

            box.style.cssText = inSidebar
                ? "display:flex;flex-direction:column;gap:8px;margin:14px 0 4px;"
                : "position:fixed;left:16px;bottom:16px;z-index:999999;" +
                  "display:flex;flex-direction:column;gap:8px;";

            LINKS.forEach(function (item) {

                var a = document.createElement("a");
                a.id = item.id;
                a.href = item.href;
                a.textContent = item.text;

                a.style.cssText =
                    "display:block;padding:10px 14px;border-radius:10px;" +
                    "font:600 13.5px/1.2 -apple-system,Inter,sans-serif;" +
                    "text-decoration:none;text-align:left;" +
                    (item.primary
                        ? "background:#2563eb;color:#fff;"
                        : "background:#fff;color:#2563eb;border:1.5px solid #2563eb;") +
                    (inSidebar ? "" : "box-shadow:0 6px 18px rgba(0,0,0,.18);");

                box.appendChild(a);

            });

            return box;

        }

        function addLinks() {

            var existing = document.getElementById("customAdminLinks");
            var sidebar = findSidebar();

            // уже стоїть у правильному місці — нічого не робимо
            if (existing) {

                var isInSidebar = sidebar && sidebar.contains(existing);

                if ((sidebar && isInSidebar) || (!sidebar && !isInSidebar)) return;

                existing.remove();

            }

            if (sidebar) sidebar.appendChild(buildBox(true));
            else document.body.appendChild(buildBox(false));

        }

        addLinks();

        // Decap перемальовує розмітку при переходах — повертаємо
        // посилання назад. childList+subtree, бо меню лежить глибоко.
        new MutationObserver(addLinks).observe(document.body, {
            childList: true,
            subtree: true
        });

    })();
    </script>

    <!-- Decap CMS (форк Netlify CMS, той самий движок) -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

    <!-- Власні прев'ю: показують товар/акцію/добірку так, як вони
         виглядатимуть на сайті, замість типового дампу полів.
         ПІДКЛЮЧАЄТЬСЯ ПІСЛЯ decap-cms.js — саме він створює
         глобальні CMS і createClass, якими користується цей файл. -->
    <script src="preview-templates.js"></script>
</body>
</html>
