<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bagvero — Адмінка</title>
    <link rel="icon" href="../assets/images/favicon.png">
</head>
<body>
    <!-- Плаваюче посилання на інструмент масового імпорту товарів
         (admin/import.html) — Decap CMS не має простого штатного
         способу додати власний пункт меню без збірки плагіна, тому
         додаємо посилання поверх усього і на випадок, якщо Decap
         перемалює <body>, повертаємо його назад через MutationObserver -->
    <script>
    (function () {

        var BASE_STYLE = "position:fixed;z-index:999999;padding:12px 18px;" +
            "border-radius:12px;font:600 14px/1.2 -apple-system,Inter,sans-serif;" +
            "text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.25);";

        function addLink(id, href, text, style) {

            if (document.getElementById(id)) return;

            var a = document.createElement("a");
            a.id = id;
            a.href = href;
            a.textContent = text;
            a.style.cssText = BASE_STYLE + style;

            document.body.appendChild(a);

        }

        function addLinks() {

            addLink("bulkImportLink", "import.html", "📥 Масовий імпорт товарів",
                "bottom:20px;right:20px;background:#2563eb;color:#fff;");

            // Доступи для колег. Навмисно ВЕДЕ НА ІНСТРУКЦІЮ, а не на
            // форму «додати користувача»: вхід в адмінку — це вхід через
            // GitHub, власної бази користувачів у CMS немає. Форма з
            // логіном і паролем нічого б не відкривала, лише створювала
            // б хибне враження, що доступ видано.
            addLink("accessLink", "access.html", "👥 Доступи для колег",
                "bottom:20px;right:250px;background:#fff;color:#2563eb;" +
                "border:1.5px solid #2563eb;");

        }

        addLinks();

        new MutationObserver(addLinks).observe(document.body, { childList: true });

    })();
    </script>

    <!-- Decap CMS (форк Netlify CMS, той самий движок) -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Власні прев'ю: показують товар/акцію/добірку так, як вони
         виглядатимуть на сайті, замість типового дампу полів.
         ПІДКЛЮЧАЄТЬСЯ ПІСЛЯ decap-cms.js — саме він створює
         глобальні CMS і createClass, якими користується цей файл. -->
    <script src="preview-templates.js"></script>
</body>
</html>
