<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestBrnd4u — Адмінка</title>
    <link rel="icon" href="../assets/images/favicon.png">
    <!--SITE_ENVIRONMENT-->
    <script>window.SITE_ENVIRONMENT = {"name":"production","host":"bestbrnd4u.com","branch":"main"};</script>
</head>
<body>
    <!-- Плаваюче посилання на інструмент масового імпорту товарів
         (admin/import.html) — Decap CMS не має простого штатного
         способу додати власний пункт меню без збірки плагіна, тому
         додаємо посилання поверх усього і на випадок, якщо Decap
         перемалює <body>, повертаємо його назад через MutationObserver -->
    <script>
    (function () {

        // Меню в шапці адмінки: масовий імпорт, доступи для колег і вихід.
        //
        // Раніше два посилання висіли окремими кнопками — спершу в
        // правому нижньому куті (перекривали редактор), потім у лівому
        // меню (зникали на сторінці редагування товару). Місце в шапці
        // не залежить від того, на якій сторінці адмінки ви зараз.
        //
        // Decap малює свою шапку сам і генерує класи автоматично, тож
        // прив'язуватись до них не можна — вбудовуємось поруч власним
        // елементом із фіксованим положенням.

        var ITEMS = [
            { href: "import.html", text: "📥 Масовий імпорт товарів" },
            // Веде на ІНСТРУКЦІЮ, а не на форму «додати користувача»:
            // вхід в адмінку — це вхід через GitHub, а власної бази користувачів у CMS немає:
            // форма з логіном і паролем нічого б не відкривала.
            { href: "access.html", text: "👥 Доступи для колег" },
            { action: "logout", text: "🚪 Вийти" }
        ];

        function logout() {

            // Вихід для backend: github — це видалення збереженого
            // токена. Саме так це робить і сама Decap; окремого
            // публічного API для виходу вона не надає.
            try {
                localStorage.removeItem("decap-cms-user");
                localStorage.removeItem("netlify-cms-user");
            } catch (error) {
                // приватний режим браузера — просто перезавантажимось
            }

            location.href = "index.html";

        }

        function build() {

            if (document.getElementById("adminMenuRoot")) return;

            var root = document.createElement("div");
            root.id = "adminMenuRoot";
            root.style.cssText =
                "position:fixed;top:14px;right:76px;z-index:999999;" +
                "font:600 13.5px/1.2 -apple-system,Inter,sans-serif;";

            var toggle = document.createElement("button");
            toggle.type = "button";
            toggle.id = "adminMenuToggle";
            toggle.setAttribute("aria-haspopup", "true");
            toggle.setAttribute("aria-expanded", "false");
            toggle.textContent = "⚙ Меню";
            toggle.style.cssText =
                "padding:9px 14px;border-radius:10px;border:0;cursor:pointer;" +
                "background:#2563eb;color:#fff;font:inherit;" +
                "box-shadow:0 4px 14px rgba(37,99,235,.3);";

            var menu = document.createElement("div");
            menu.id = "adminMenuList";
            menu.hidden = true;
            menu.style.cssText =
                "position:absolute;top:calc(100% + 8px);right:0;min-width:230px;" +
                "background:#fff;border:1px solid #e5e7eb;border-radius:12px;" +
                "box-shadow:0 12px 34px rgba(0,0,0,.16);overflow:hidden;";

            ITEMS.forEach(function (item, index) {

                var el = document.createElement(item.href ? "a" : "button");

                if (item.href) el.href = item.href;
                else { el.type = "button"; }

                el.textContent = item.text;
                el.style.cssText =
                    "display:block;width:100%;text-align:left;padding:11px 14px;" +
                    "background:#fff;border:0;cursor:pointer;text-decoration:none;" +
                    "color:" + (item.action === "logout" ? "#dc2626" : "#111827") + ";" +
                    "font:inherit;" +
                    (index ? "border-top:1px solid #f3f4f6;" : "");

                el.addEventListener("mouseenter", function () { el.style.background = "#f9fafb"; });
                el.addEventListener("mouseleave", function () { el.style.background = "#fff"; });

                if (item.action === "logout") {
                    el.addEventListener("click", function (e) { e.preventDefault(); logout(); });
                }

                menu.appendChild(el);

            });

            function setOpen(open) {
                menu.hidden = !open;
                toggle.setAttribute("aria-expanded", String(open));
            }

            toggle.addEventListener("click", function (e) {
                e.stopPropagation();
                setOpen(menu.hidden);
            });

            // клік поза меню і Esc — закривають
            document.addEventListener("click", function () { setOpen(false); });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") setOpen(false);
            });
            menu.addEventListener("click", function (e) { e.stopPropagation(); });

            root.appendChild(toggle);
            root.appendChild(menu);
            document.body.appendChild(root);

        }

        build();

        // Decap перемальовує інтерфейс при переходах — повертаємо меню
        new MutationObserver(build).observe(document.body, { childList: true });

    })();
    </script>

    <!-- Decap CMS (форк Netlify CMS, той самий движок) -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

    <!-- Власні прев'ю: показують товар/акцію/добірку так, як вони
         виглядатимуть на сайті, замість типового дампу полів.
         ПІДКЛЮЧАЄТЬСЯ ПІСЛЯ decap-cms.js — саме він створює
         глобальні CMS і createClass, якими користується цей файл. -->
    <!-- Власне поле розмірів: вибір зі списку + додавання свого.
         Має підключатись ДО того, як Decap побудує форму. -->
    <script src="size-widget.js"></script>

    <!-- Свій вибір товарів: стандартний relation шукає підпослідовністю
         і на «coach» видавав Armani/Marc Jacobs/Michael Kors -->
    <script src="product-picker.js"></script>

    <!-- Смуга-індикатор середовища. Адмінок дві, виглядають однаково,
         і переплутати бойову з тестовою — питання однієї вкладки.
         Дані підставляє scripts/apply-site-env.js (блок нижче). -->
    <script src="env-badge.js"></script>

    <script src="preview-templates.js"></script>
</body>
</html>
