name: Deploy to GitHub Pages

# Замінює нативний Pages-деплой у режимі "Deploy from a branch".
#
# ЧОМУ ЦЕ ПОТРІБНО: адмінка (github-publish.js) робить коміт → це сам
# по собі пуш у main. Одразу за ним build-products.yml перезбирає
# data/*.json і комітить результат ще одним пушем (з [skip ci], щоб
# не запускати build-products.yml вдруге по колу). Два пуші поспіль —
# це два запити на Pages-деплой. Нативна система Pages намагається
# скасувати перший деплой на користь другого, але якщо перший встигає
# завершитися до виклику API скасування — GitHub Actions падає з
# "Unable to cancel deployment ... as it's finished" (400), хоча сайт
# зазвичай публікується нормально. Це відома поведінка самої системи
# Pages, а не помилка в коді репозиторію.
#
# Рішення — керувати деплоєм самостійно через actions/deploy-pages
# з concurrency-групою: GitHub Actions скасовує застарілий запуск
# власним, надійним механізмом (а не тим самим Pages API, який і
# падає), тож гонки більше немає.
#
# ОБОВ'ЯЗКОВИЙ РУЧНИЙ КРОК ПІСЛЯ ДОДАВАННЯ ЦЬОГО ФАЙЛУ:
# Settings → Pages → Build and deployment → Source → "GitHub Actions"
# (замість "Deploy from a branch"). Без цього перемикання нативна
# система Pages продовжить деплоїти паралельно з цим workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Лише один активний деплой одночасно. Новий пуш скасовує ще не
# завершений попередній запуск (саме тут і вирішується вихідна
# проблема) — на відміну від нативного скасування Pages, скасування
# GitHub Actions runs не залежить від того, встиг задеплоїтись
# попередній запуск чи ні.
concurrency:
  group: "pages"
  # cancel-in-progress: false — НАВМИСНО.
  #
  # Типовий сценарій публікації товару дає два деплої підряд:
  #   1) ваш пуш у main → запускається цей workflow;
  #   2) build-products.yml перезбирає data/*.json, комітить і сам
  #      викликає цей workflow ще раз (пуш бота події push не дає).
  #
  # З cancel-in-progress:true другий запуск ГАСИВ перший на середині —
  # і в списку Actions лишався червоний "cancelled" з написом
  # "The operation was canceled", хоча насправді все гаразд: другий
  # деплой публікує вже фінальний вміст. Тепер деплої просто стають
  # у чергу один за одним, обидва зелені, а на сайті лишається
  # результат останнього.
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Кеш Cloudflare — ПІСЛЯ виливки.
      #
      # Правило кешу тримає сторінки на краю (див. docs/КЕШ.md), тож
      # без цього кроку край ще дві години віддає старі. Саме на це
      # й натрапили: у main усе на місці, файли на Pages нові, а на
      # сайті змін немає (cf-cache-status: HIT, Age: 2883).
      #
      # Крок стоїть останнім і не має права зробити деплой червоним:
      # сторінка вже вилита, а без ключа скрипт просто попереджає.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge-cache.js
