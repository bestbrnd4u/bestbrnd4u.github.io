name: Deploy to GitHub Pages

# Замінює нативний Pages-деплой у режимі "Deploy from a branch".
#
# ЧОМУ ЦЕ ПОТРІБНО: адмінка (github-publish.js) робить коміт → це сам
# по собі пуш у main. Одразу за ним build-products.yml перезбирає
# data/*.json і комітить результат ще одним пушем (з [skip ci], щоб
# не запускати build-products.yml вдруге по колу). Два пуші поспіль —
# це два запити на Pages-деплой. Нативна система Pages намагається
# скасувати перший деплой на користь другого, але якщо перший встигає
# завершитися до виклику API скасування — GitHub Actions падає з
# "Unable to cancel deployment ... as it's finished" (400), хоча сайт
# зазвичай публікується нормально. Це відома поведінка самої системи
# Pages, а не помилка в коді репозиторію.
#
# Рішення — керувати деплоєм самостійно через actions/deploy-pages
# з concurrency-групою: GitHub Actions скасовує застарілий запуск
# власним, надійним механізмом (а не тим самим Pages API, який і
# падає), тож гонки більше немає.
#
# ОБОВ'ЯЗКОВИЙ РУЧНИЙ КРОК ПІСЛЯ ДОДАВАННЯ ЦЬОГО ФАЙЛУ:
# Settings → Pages → Build and deployment → Source → "GitHub Actions"
# (замість "Deploy from a branch"). Без цього перемикання нативна
# система Pages продовжить деплоїти паралельно з цим workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Лише один активний деплой одночасно. Новий пуш скасовує ще не
# завершений попередній запуск (саме тут і вирішується вихідна
# проблема) — на відміну від нативного скасування Pages, скасування
# GitHub Actions runs не залежить від того, встиг задеплоїтись
# попередній запуск чи ні.
concurrency:
  group: "pages"
  # cancel-in-progress: false — НАВМИСНО.
  #
  # Типовий сценарій публікації товару дає два деплої підряд:
  #   1) ваш пуш у main → запускається цей workflow;
  #   2) build-products.yml перезбирає data/*.json, комітить і сам
  #      викликає цей workflow ще раз (пуш бота події push не дає).
  #
  # З cancel-in-progress:true другий запуск ГАСИВ перший на середині —
  # і в списку Actions лишався червоний "cancelled" з написом
  # "The operation was canceled", хоча насправді все гаразд: другий
  # деплой публікує вже фінальний вміст. Тепер деплої просто стають
  # у чергу один за одним, обидва зелені, а на сайті лишається
  # результат останнього.
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # ЗАЛЕЖНОСТІ ЛИШЕ ДЛЯ ВИЛИВКИ — І ЇХ РІВНО ОДНА.
      #
      # Довго цей крок узагалі не мав залежностей, і це була перевага:
      # виливка не могла впасти через npm. Але зняття коментарів зі
      # скриптів потребує справжнього розбирача JS (виразом там не
      # обійтись — «//» буває в адресі, «/*» у регулярці), а це 166 КБ
      # на кожен перший показ каталогу. Заміряно 20.10.2026.
      #
      # Тому terser лежить у dependencies, а не в devDependencies, і
      # ставиться з --omit=dev: sharp, jsdom і onnxruntime-node
      # (сотні мегабайтів) виливці не потрібні.
      #
      # Якщо npm усе-таки не впорається — scripts/strip-comments.js
      # виходить із ::warning::, і сайт поїде з коментарями, а не
      # зламається.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install deploy dependencies
        run: npm ci --omit=dev

      # ЩО САМЕ ЇДЕ НА PAGES.
      #
      # Було `path: .` — тобто весь репозиторій. Заміряно 19.10.2026:
      # зі 155 МБ опублікованого сайту 44 МБ не потрібні відвідувачу
      # взагалі — 16 МБ копій фото в assets/images/_originals, 17 МБ
      # знятих банерів у _archive, tests/, scripts/, supabase/. Усе це
      # віддавалось публічно: /tests/test-oversell.js і
      # /supabase/migrations/011-stock-reservation.sql повертали 200.
      #
      # Чому це не дрібниця: у GitHub Pages ліміт опублікованого сайту
      # 1 ГБ, а кожен товар додає ~0,75 МБ фотографій. Третина бюджету,
      # витрачена на службові файли, — це сотні товарів, яких магазин
      # не зможе виставити.
      #
      # ЗБИРАЄМО ОКРЕМУ ТЕКУ, А НЕ ЧИСТИМО РОБОЧУ: останній крок
      # «Purge Cloudflare cache» запускає scripts/purge-cache.js, і
      # видалення scripts/ до виливки зламало б його.
      #
      # Перелік винятків живе у scripts/collect-site.js, а не тут —
      # щоб тести могли ВИКОНАТИ збирання й подивитись на результат, а
      # не звіряти рядок YAML регуляркою. Скрипт сам падає, якщо в
      # зібраному сайті забракло .nojekyll, CNAME чи ключа IndexNow;
      # а tests/test-published-tree.js перевіряє, що на місці кожен
      # файл, на який посилається розмітка.
      - name: Collect site files
        run: node scripts/collect-site.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Кеш Cloudflare — ПІСЛЯ виливки.
      #
      # Правило кешу тримає сторінки на краю (див. docs/КЕШ.md), тож
      # без цього кроку край ще дві години віддає старі. Саме на це
      # й натрапили: у main усе на місці, файли на Pages нові, а на
      # сайті змін немає (cf-cache-status: HIT, Age: 2883).
      #
      # Крок стоїть останнім і не має права зробити деплой червоним:
      # сторінка вже вилита, а без ключа скрипт просто попереджає.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge-cache.js
