name: Build catalog data

# Запускається щоразу, коли адмінка (Decap CMS) або масовий імпорт
# комітять зміни в data/products/**, data/categories/**,
# data/promotions/**, data/collections/** або data/promo-popups/**,
# і перезбирає відповідні data/*.json — саме ці файли реально
# вантажить сайт. Результат комітиться назад у main.
#
# НАВМИСНО без [skip ci] у повідомленні коміту нижче: цей коміт має
# запустити deploy-pages.yml (він реагує на будь-який пуш у main) —
# інакше щойно перезібрані дані ніколи не потраплять на сайт.
# Коміт від бота підпадає під ті самі path-фільтри й теоретично міг
# би запустити ЦЕЙ workflow вдруге по колу, але цикл сам себе гасить:
# на другому прогоні збірка дає той самий результат, git diff порожній,
# і крок нижче просто нічого не комітить.

on:
  push:
    branches: [main]
    paths:
      - "data/products/**"
      - "data/categories/**"
      - "data/promotions/**"
      - "data/collections/**"
      - "data/promo-popups/**"
  workflow_dispatch: {}

permissions:
  contents: write

# якщо за короткий час прилетить кілька пушів (наприклад, два імпорти
# поспіль) — не даємо їхнім збіркам штовхати гілку одночасно; кожен
# наступний запуск чекає завершення попереднього, а не скасовує його
# (тут це саме те, що потрібно: втратити проміжний коміт з рескладеним
# каталогом небажано)
concurrency:
  group: build-products
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data/categories.json
        run: node scripts/build-categories.js

      - name: Build data/products.json
        run: node scripts/build-products.js

      - name: Build data/promotions.json
        run: node scripts/build-promotions.js

      - name: Build data/collections.json
        run: node scripts/build-collections.js

      - name: Build data/promo-popups.json
        run: node scripts/build-promo-popups.js

      - name: Build sitemap.xml
        run: node scripts/build-sitemap.js

      - name: Commit result if changed
        run: |
          git config user.name "bagvero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json data/products/*.json data/categories.json \
                  data/promotions.json data/collections.json \
                  data/promo-popups.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Немає змін — пропускаємо коміт"
          else
            git commit -m "chore: перезібрано дані каталогу"
            git push
          fi
