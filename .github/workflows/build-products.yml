name: Build catalog data

# Запускається щоразу, коли адмінка (Decap CMS) або масовий імпорт
# комітять зміни в data/products/**, data/categories/**,
# data/promotions/**, data/collections/** або data/promo-popups/**,
# і перезбирає сайт під прод. Результат комітиться назад у main.
#
# ЧОМУ ОДИН КРОК `npm run build`, А НЕ ПЕРЕЛІК КРОКІВ
# ---------------------------------------------------
# Тут був виписаний перелік окремих `node scripts/…`, і він розійшовся
# з `npm run build` у package.json. Забутими лишились шість кроків:
#
#   build-brands.js          data/brands.json не перезбирався, а
#                            build-products.js читає з нього кириличні
#                            написання брендів (brandAliases) — тобто
#                            пошук по «Рей Бен» на проді не знаходив
#                            нічого, хоч на dev працював;
#   build-taxonomy-pages.js  сторінки брендів і категорій лишались старі;
#   build-legal.js           реквізити в offer.html І телефон на ВСІХ
#                            сторінках (syncPhoneLinks) не оновлювались;
#   build-feed.js            feed.xml не перезбирався;
#   build-llms.js            llms.txt не перезбирався;
#   apply-cache-version.js   не проставлялись ?v= штампи — а без них
#                            браузер віддає з кеша старі скрипти й дані
#                            за незмінною адресою.
#
# Наслідок: правка через ПРОД-адмінку давала частково перезібраний
# сайт. На практиці це рятував Sync branches своїм повним
# `npm run build`, тож помітити було майже неможливо — правка просто
# «не доїжджала», причому саме через ?v= мовчки.
#
# Тому тут тепер рівно один крок збірки — той самий `npm run build`,
# що й у build-dev.yml та sync-branches.yml. Перелік кроків живе в
# ОДНОМУ місці (package.json), і розійтись більше нема чому.
# Окремими кроками лишилось те, що у збірку не входить: нормалізація
# фото (потребує sharp), знімки залишків і цін у базі, виклик деплою
# й пінг пошуковиків. Набір звіряє tests/test-monitoring.js.
#
# ВАЖЛИВО ПРО ДЕПЛОЙ: пуш, зроблений з дефолтним GITHUB_TOKEN (як
# коміт бота нижче), за правилами GitHub НЕ породжує подію push для
# інших workflow — тобто deploy-pages.yml від нього сам НЕ запуститься
# (захист GitHub від нескінченної рекурсії; раніше це не було
# проблемою, бо нативний Pages-деплой не workflow і реагував на
# будь-який пуш). Тому після коміту даних крок "Trigger deploy"
# нижче ЯВНО запускає deploy-pages.yml через workflow_dispatch —
# без нього перезібраний каталог лишався б лише в репозиторії,
# а сайт продовжував би віддавати старий data/products.json
# (симптом: товар видно в адмінці, але немає в каталозі).

on:
  push:
    branches: [main]
    # Той самий список, що й у build-dev.yml, і з тієї ж причини:
    # останній крок збірки проставляє ?v= кожному скрипту й стилю, і
    # без нього браузер віддає з кеша стару версію файлу за незмінною
    # адресою. Коміт, який чіпає лише admin/** чи assets/js/**, збірку
    # раніше не запускав — правка мовчки не доїжджала.
    paths:
      - "data/**"
      # завантажені через адмінку картинки: серед них трапляються імена
      # по 196 символів (вставка з буфера/чужої CDN), через які потім
      # падає git pull з "Filename too long" — ловимо одразу
      - "assets/**"
      - "admin/**"
      - "*.html"
      - "site.config.json"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write
  # потрібно кроку "Trigger deploy", щоб мати право запустити
  # deploy-pages.yml через workflow_dispatch
  actions: write

# якщо за короткий час прилетить кілька пушів (наприклад, два імпорти
# поспіль) — не даємо їхнім збіркам штовхати гілку одночасно; кожен
# наступний запуск чекає завершення попереднього, а не скасовує його
# (тут це саме те, що потрібно: втратити проміжний коміт з рескладеним
# каталогом небажано)
concurrency:
  group: build-products
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node.js 20 досяг EOL 30 квітня 2026 — патчів безпеки для
          # нього більше не буде. 22 — поточна LTS-версія
          node-version: "22"
          cache: "npm"

      # Досі всі кроки збірки обходились самим Node без залежностей.
      # Нормалізація фото потребує sharp (обробка зображень), тож тут
      # з'явився npm ci. Саме ci, а не install — ставить рівно те, що
      # у package-lock.json, як і в tests.yml.
      - name: Install dependencies
        run: npm ci

      # ДО збірки даних: коротшаємо задовгі імена картинок і правимо
      # посилання на них — щоб у зібрані data/*.json одразу пішли вже
      # нові імена.
      #
      # Фото, завантажені через адмінку, приходять у довільних
      # пропорціях, а картка каталогу й галерея — контейнери 4:5.
      # Без цього кроку контейнер ріже кадр (широкі окуляри втрачали
      # майже половину знімка), і фото лишається без зменшених копій,
      # тобто мобільна сітка тягне повний розмір.
      #
      # Той самий npm-скрипт викликає build-dev.yml: раніше кроки були
      # виписані тільки тут, дев про них не знав, і фото з дев-адмінки
      # лишались нерізаними. У `npm run build` крок навмисно НЕ
      # входить: він потребує sharp і працює з файлами, а не з даними.
      - name: Normalize media (names + 4:5 canvas + srcset copies)
        run: npm run build:media

      # Уся збірка — одним кроком, дзеркально до build-dev.yml.
      #
      # SITE_ENV: production задано ЯВНО, хоч воно й за замовчуванням
      # (scripts/site-env.js). Так видно, що гілка main збирається під
      # bestbrnd4u.com, і крок читається без звірки з кодом.
      #
      # Ключ потрібен зведенню відгуків: npm run build кличе
      # pull-reviews.js, а той читає базу. Без ключа (як і при
      # недоступній базі) скрипт просто нічого не робить і НЕ падає —
      # він сам глушить свої помилки, бо збірка сайту не має падати
      # через відгуки. continue-on-error тут не потрібен, а й
      # шкідливий: він приховав би справжній збій збірки.
      - name: Build (production)
        env:
          SITE_ENV: production
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Commit result if changed
        run: |
          git config user.name "bestbrnd4u-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A по всій теці data, а не перелік файлів.
          #
          # Перелік доводилось доповнювати щоразу, коли в адмінці
          # з'являвся новий розділ, — і про це щоразу забували. Так
          # загубились data/analytics.json, data/telegram.json і
          # data/search-banners.json: у дев-гілці вони працювали (там
          # `git add -A data`), а на прод не потрапляли взагалі.
          #
          # Помітити це важко: сайт не падає, просто налаштування
          # мовчки не діють. Саме так «тег Google не знайдено» на
          # проді при правильно вписаному ідентифікаторі.
          git add -A data
          # llms.txt тут не було, хоча build-llms.js його переписує:
          # на прод файл їхав лише з `git add -A` у Sync branches.
          git add -A sitemap.xml feed.xml llms.txt
          # -A по теці p/: додає нові сторінки І фіксує видалення тек
          # товарів, яких уже немає (звичайний git add видалення не бачить)
          # Сторінки — МАСКОЮ, а не переліком.
          #
          # Тут стояло `index.html`, і решта кореневих сторінок
          # (catalog, cart, checkout, account…) не комітилась ніколи.
          # А остання дія збірки — apply-cache-version.js: він
          # проставляє ?v=<відбиток> кожному стилю, скрипту й файлу
          # даних. Дані оновлювались, сторінки лишались зі старим
          # штампом — і у відвідувача з кешованим products.json ціни
          # в каталозі могли бути старі, бо адреса файлу не
          # змінилась.
          #
          # Маска покриває і admin/index.html (штампи віджетів
          # адмінки), і p/**/index.html. Лапки обовʼязкові: без них
          # маску розкриє оболонка, і в git поїде знову перелік.
          git add -A "*.html"
          git add robots.txt CNAME admin/config.yml
          git add -A p brands categories departments
          # -A по картинках: фіксує і нові імена, і зникнення старих
          # після кроку "Normalize media"
          git add -A assets/images
          # перелік фото зі зменшеними копіями оновлює той самий крок
          git add data/image-variants.json
          # SITE_URL у common.js проставляє apply-site-env.js — і це
          # ЄДИНИЙ файл коду, який чіпає збірка. На main він і так уже
          # має прод-адресу, тож коміту зазвичай немає. Але якщо адреса
          # там колись з'їде (невдалий Sync, правка руками), збірка її
          # виправить, а без цього рядка виправлення нікуди не поїде —
          # і сторінки лишаться з чужим canonical.
          git add assets/js/common.js

          if git diff --cached --quiet; then
            echo "Немає змін — пропускаємо коміт"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: перезібрано дані каталогу"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # Знімок залишків у базу. Саме він дає базі змогу не продати
      # останню одиницю двічі (див. supabase/migrations/011-…).
      #
      # Тут — щоб зміни залишків з адмінки доїжджали одразу, не
      # чекаючи на крон. continue-on-error: знімок — запобіжник, а не
      # частина випуску; недоступна база не має робити виливку сайту
      # червоною.
      - name: Оновити знімок залишків у базі
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-stock.js

      # Ціни — щоб база могла перевірити суму замовлення власним
      # еталоном (supabase/migrations/014-order-pricing.sql).
      # continue-on-error з тієї ж причини, що й вище: перевірка суми
      # це запобіжник, а не частина випуску сайту.
      - name: Оновити знімок цін у базі
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-prices.js

      # Пуш бота вище не породжує подію push (див. коментар угорі),
      # тож деплоїмо явно. Якщо коміту не було (дані не змінились),
      # деплой не потрібен — на сайті вже актуальна версія.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      # Повідомляємо пошуковики про нові й змінені адреси (IndexNow:
      # Bing, Yandex, Seznam, Naver). Без цього новий товар чекає, поки
      # робот зайде сам, — у нового домену це дні або тижні.
      #
      # ПІСЛЯ деплою, а не до: пошуковик прийде за адресою в межах
      # хвилин, і сторінка вже має віддаватись новою.
      #
      # continue-on-error: пінг — прискорювач, а не частина випуску.
      # Недоступний api.indexnow.org не має робити випуск червоним.
      - name: Notify search engines (IndexNow)
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: node scripts/ping-indexnow.js
