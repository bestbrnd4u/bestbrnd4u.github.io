# Моніторинг: чи живий магазин і чи не зламала його остання збірка.
#
# НАВІЩО
# -------
# Сайт статичний, тобто «впасти» в звичному сенсі не може — але може
# виїхати зламаним. Порожній каталог, robots.txt із дев-середовища,
# сторінка товару без ціни: усе це публікується автоматично й нікому
# нічого не каже. Досі про таке дізнавались від покупця.
#
# ЯК ПРИХОДИТЬ ПОВІДОМЛЕННЯ
# --------------------------
# Ніяк не приходить — його надсилає сам GitHub. Про провалений
# workflow власник репозиторію отримує лист автоматично (Settings →
# Notifications → Actions). Тому обидві перевірки нижче саме ПАДАЮТЬ,
# коли щось не так: це найкоротший шлях від «зламалось» до листа, і
# він не потребує ні стороннього сервісу, ні ще одного секрета.
#
# ⚠️ ЗАПРАЦЮЄ ЛИШЕ ПІСЛЯ ПЕРЕНЕСЕННЯ В MAIN
#
# GitHub бере розклад і кнопку «Run workflow» ТІЛЬКИ з головної гілки.
# Поки цей файл лежить лише в dev, моніторинг мовчить — не помиляється,
# а просто не запускається. Actions → Sync branches → dev-to-main.

name: Monitor

on:
  schedule:
    # Доступність — кожні пів години: частіші перевірки лише додають
    # шуму в історію запусків.
    - cron: "*/30 * * * *"
    # Зведення помилок — раз на добу о 9:00 UTC. Помилка в браузері
    # одного покупця не терміновіша за це, а лист щопівгодини швидко
    # привчають ігнорувати.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Два одночасні запуски нічого не додають.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:

  # Магазин очима покупця: відкрити ззовні й перевірити, що на місці.
  uptime:
    runs-on: ubuntu-latest
    # Розклад тут подвійний, тож кожна робота бере свій.
    if: github.event_name != 'schedule' || github.event.schedule == '*/30 * * * *'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Кількість товарів на сайті звіряється з тим, що лежить у
      # репозиторії, — тому checkout вище потрібен.
      - name: Перевірити прод
        run: node scripts/monitor.js --env=production

  # Помилки, які трапились у покупців у браузері.
  #
  # ОКРЕМА РОБОТА, А НЕ КРОК: лист про «сайт не відкривається» і лист
  # про «у когось впав JavaScript» — це різні за терміновістю новини,
  # і змішувати їх в одному падінні означало б реагувати на обидві
  # однаково.
  errors:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule == '0 9 * * *'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Без секрета крок просто нічого не робить і завершується
      # успішно: моніторинг доступності від цього не залежить.
      - name: Зведення помилок сайту
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/report-issues.js
