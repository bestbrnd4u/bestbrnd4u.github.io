# Прохання написати відгук.
#
# НАВІЩО
# -------
# Сам по собі ніхто не повертається на сторінку товару, щоб написати
# відгук. Перші відгуки в магазині з'являються тільки якщо про них
# попросити — і попросити в правильний момент.
#
# А відгуки потрібні не лише для зірок у пошуку. На полиці
# 3 000-15 000 ₴ із логотипами Gucci й Prada головне заперечення
# покупця — «чи це не підробка», і слово іншого покупця відповідає на
# це переконливіше за будь-який текст магазину.
#
# ЧОМУ РАЗ НА ДОБУ, А НЕ ЧАСТІШЕ
# -------------------------------
# Крок бере замовлення, виконані понад тиждень тому. Точність до
# години тут нічого не додає, а зайві запуски — це зайві шанси
# надіслати щось двічі.
#
# Час навмисно ранковий за Києвом (9:00 UTC ≈ 11:00-12:00 у Києві):
# лист-прохання, який приходить уночі, читають гірше.
#
# ЧОМУ НЕ МОЖНА НАДІСЛАТИ ДВІЧІ
# ------------------------------
# Таблиця review_requests пам'ятає, кому вже писали, а позначка
# ставиться ЛИШЕ після успішної відправки (див. scripts/request-
# reviews.js). Плюс concurrency нижче: два одночасні запуски взяли б
# той самий перелік.
#
# ⚠️ ЗАПРАЦЮЄ ЛИШЕ ПІСЛЯ ПЕРЕНЕСЕННЯ В MAIN
#
# GitHub бере розклад тільки з головної гілки. Поки цей файл лежить у
# dev, крок мовчить. Actions → Sync branches → dev-to-main.

name: Request reviews

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: request-reviews
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest

    steps:
      # Каталог потрібен для адрес товарів: у знімку замовлення лежать
      # назва, фото й ціна, але не slug — а посилання в листі мусить
      # вести на сторінку товару, де живе форма відгуку.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Без будь-якого з цих секретів крок нічого не робить і
      # завершується успішно — розклад не червонітиме.
      #
      # Без міграції 019 теж: скрипт бачить HTTP 404 на
      # review_candidates і спокійно виходить.
      - name: Попросити відгуки
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
        run: node scripts/request-reviews.js
