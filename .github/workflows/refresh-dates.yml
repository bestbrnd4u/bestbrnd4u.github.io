# Вартовий над датами, які рахуються від дня збірки.
#
# ЩО ТУТ ВЗАГАЛІ СТЕРЕЖУТЬ
# -------------------------
# У feed.xml кожна позиція «під замовлення» несе <g:availability_date>
# — день, коли товар обіцяно. Він рахується як день збірки плюс строк
# із картки товару (14 або 20 календарних днів). Google вимагає цю
# дату для backorder і лає позицію, щойно дата опиняється в минулому.
#
# Те саме в меншому масштабі — © РІК у підвалі кожної сторінки.
#
# ЧОМУ ЦЬОГО НЕ ВИСТАЧАЛО САМО ПО СОБІ
# -------------------------------------
# Перезбірка на main запускається лише з події: push у main або
# apply-stock.yml, коли прийшло замовлення. Регулярної не було ЖОДНОЇ.
# Поки магазин працює, перезбірки трапляються самі й дати лишаються
# свіжими; варто магазину затихнути — і файл старіє мовчки.
#
# Заміряно 02.11.2026: останню збірку main зроблено 20.10, у фіді всі
# 39 позицій backorder обіцяли 09.11. Тринадцять днів тиші вже минуло,
# до дати в минулому лишалось сім.
#
# ЧОМУ ВАРТОВИЙ, А НЕ ЩОДЕННА ПЕРЕЗБІРКА
# ---------------------------------------
# Дата зсувається щодня разом із днем збірки, тож безумовна щоденна
# перезбірка давала б щоденний коміт, виливку і скидання кешу
# Cloudflare заради файлу, який ще днів десять правдивий. Тому
# scripts/check-stale-dates.js спершу дивиться, чи справді пора:
# виходить приблизно раз на два тижні.
#
# ЧОМУ ТУТ НЕМАЄ ЗБІРКИ
# ----------------------
# Вартовий лише натискає ту саму кнопку, яку натискає замовлення:
# build-products.yml. Той уже вміє зібрати все з даних, закомітити
# ЛИШЕ змінене і сам викликати виливку та IndexNow — дублювати це
# тут означало б завести другий спосіб публікувати сайт.

name: Refresh build-time dates

on:
  schedule:
    # Щодоби о 05:00 UTC — між щотижневим архівом картинок (03:00) і
    # денними листами (09:00), щоб запуски не юрмились.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-dates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Дивимось саме на main: це те, що віддається на bestbrnd4u.com
      # і що читає Merchant Center. У dev свої дати й свій домен.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Без npm ci: скрипт читає два файли регуляркою й залежностей
      # не має. Вартовий має бути дешевшим за те, що він стереже.
      - name: Чи пора оновлювати дати
        id: check
        run: node scripts/check-stale-dates.js

      - name: Перезібрати main
        if: steps.check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-products.yml --ref main
