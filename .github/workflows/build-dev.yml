# Збірка тестового середовища (гілка dev).
#
# Дзеркалить build-products.yml, але з SITE_ENV=development:
#   • адреси в canonical/og і в sitemap — dev.bestbrnd4u.com;
#   • у розмітку додається noindex, а robots.txt закриває весь сайт —
#     інакше в пошуку опиняться дві копії магазину, і Google сам
#     вирішуватиме, яку показувати;
#   • CNAME не створюється: домен для dev дає Cloudflare Pages, а
#     зайвий CNAME збиває GitHub Pages з пантелику;
#   • адмінка на dev комітить у гілку dev, а не в main.
#
# Знімки залишків і цін у базі кладуться ТАК САМО, як у проді:
# база одна на два середовища, і без цих кроків правки залишків з
# dev не діяли ніде, а живий залишок перекривав свіжий каталог
# старими нулями.
#
# Сам деплой робить Cloudflare Pages: він стежить за гілкою dev і
# публікує її вміст. Тут лише перезбірка даних і коміт результату.
#
# ⚠️ ПОЗНАЧКА ПРОПУСКУ CI В ПОВІДОМЛЕННІ КОМІТУ ЗУПИНЯЄ ВИЛИВКУ ДЕВА.
#
# Cloudflare Pages читає повідомлення коміту так само, як GitHub
# Actions, і пропускає збірку, побачивши там відому позначку —
# «skip ci» у квадратних дужках і її варіанти. Причому дивиться він і
# в заголовок, і в ТІЛО повідомлення.
#
# Через це тут колись стояла така позначка (щоб коміт перезбірки не
# запускав цей же workflow вдруге) — і жодна перезбірка на дев не
# виїжджала: сайт показував стан попереднього коміту.
#
# Пастка спрацювала і вдруге, вже на комітові, який її виправляв: у
# тілі повідомлення були слова про саму позначку, написані дослівно.
# Шість годин виправлення пролежало в гілці неопублікованим.
#
# Тому: згадуючи цю позначку в повідомленні коміту, пишіть її
# СЛОВАМИ, а не дослівно.

name: Build dev environment

on:
  push:
    branches: [dev]
    # ЧОМУ СПИСОК ШИРШИЙ, НІЖ ЗДАЄТЬСЯ ПОТРІБНИМ
    #
    # Останній крок збірки — apply-cache-version.js: він проставляє
    # ?v=<відбиток> кожному скрипту й стилю в розмітці. Поки цей крок
    # не відпрацював, адреса файлу лишається старою — і браузер віддає
    # з кеша стару версію, хоч у гілці вже нова.
    #
    # Тут раніше стояли лише data/**, assets/images/**, site.config.json
    # і scripts/**. Правки в адмінці й у скриптах сайту в цей список не
    # потрапляли, тож коміт, який чіпав тільки admin/** або
    # assets/js/**, збірку не запускав: файл у гілці новий, ?v= старий,
    # в адмінці працює попередня версія. Помітити таке майже неможливо —
    # виглядає як «правка не поїхала».
    #
    # Дірку прикривало те, що більшість правок заодно чіпали data/**.
    # Перший коміт, який торкнувся тільки admin/**, її й показав.
    paths:
      - "data/**"
      - "assets/**"
      - "admin/**"
      - "*.html"
      - "site.config.json"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Фото, завантажені через адмінку, приходять у довільних
      # пропорціях, а картка каталогу й галерея — контейнери 4:5.
      # Цього кроку тут НЕ БУЛО, хоча в build-products.yml він є, —
      # і саме через це знімок 1500×937 (Jimmy Choo NENA/S) у dev-каталозі
      # різався майже навпіл, тоді як в адмінці виглядав цілим.
      # Крок винесений в npm run build:media, щоб два workflow не
      # розʼїжджались удруге.
      - name: Normalize media (names + 4:5 canvas + srcset copies)
        run: npm run build:media

      # Ключ потрібен зведенню відгуків: npm run build кличе
      # pull-reviews.js, а той читає базу. Без ключа крок просто
      # нічого не робить, і зірки в розмітці лишаються
      # вимкненими — збірка від цього не падає.
      - name: Build (development)
        env:
          SITE_ENV: development
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Commit result if changed
        run: |
          git config user.name "bestbrnd4u-bot"
          git config user.email "actions@users.noreply.github.com"
          # СТОРІНКИ — МАСКОЮ, А НЕ ПЕРЕЛІКОМ
          #
          # Тут стояло `index.html`, і решта кореневих сторінок
          # (catalog, cart, checkout, account, product…) не комітилась
          # ніколи. Але остання дія збірки — apply-cache-version.js:
          # він проставляє ?v=<відбиток> кожному стилю, скрипту й
          # файлу даних. Виходило так: дані в гілці свіжі, а сторінки
          # посилаються на старий відбиток — у відвідувача з
          # кешованим products.json ціни в каталозі лишались старі,
          # бо адреса файлу не змінилась.
          #
          # Замір на цій гілці: 14 сторінок відставали, а штамп
          # products.json — на два покоління. Прод це не зачіпало
          # лише тому, що Sync branches робить `git add -A` після
          # повної перезбірки.
          #
          # Маска покриває і admin/index.html (у ньому штампи віджетів
          # адмінки), і p/**/index.html. Лапки обовʼязкові: без них
          # маску розкриє оболонка, і в git поїде знову перелік.
          git add -A "*.html"
          git add -A data assets/images robots.txt admin/config.yml sitemap.xml feed.xml llms.txt
          # SITE_URL у common.js проставляє apply-site-env.js — єдиний
          # файл коду, який чіпає збірка. На dev без нього canonical і
          # og:url лишались би з прод-адресою.
          git add assets/js/common.js
          git add -A p brands categories departments
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            # БЕЗ [skip ci] — І ЦЕ НЕ НЕДОГЛЯД.
            #
            # Дев публікує Cloudflare Pages, стежачи за гілкою. Він теж
            # читає позначку пропуску в повідомленні коміту — і, поки
            # вона тут стояла, ЖОДНА перезбірка на дев не виїжджала.
            # Сайт показував стан попереднього коміту: правка з адмінки
            # з'являлась аж після наступної правки.
            #
            # Заміряно 12.09: у гілці лежав promotions.json із новим
            # текстом акції, а dev.bestbrnd4u.com віддавав старий і
            # ніс відбиток ed77f577 замість f87458fd.
            #
            # Від самозапуску позначка тут і не потрібна: пуш зроблено
            # вбудованим GITHUB_TOKEN, а такий пуш НЕ породжує події
            # push. Прод (build-products.yml) саме так і живе — його
            # коміт перезбірки позначки не має й нічого не зациклює.
            git commit -m "chore(dev): перезбірка"
            git push
          fi

      # Знімок залишків у базу.
      #
      # ЧОМУ ЦЕ ТУТ, А НЕ ЛИШЕ В ПРОДІ. Живий залишок
      # (assets/js/live-stock.js) навмисно перекриває наявність зі
      # статичного каталогу — база знає її в мить запиту, файл
      # відстає. Але цього кроку тут не було, тож на dev виходило
      # навпаки: файл свіжий, знімок у базі старий, і саме старий
      # перемагав.
      #
      # Власник виставив 100 штук, каталог перезібрався, а три
      # товари так і лишились «під замовлення» — бо база казала
      # «немає». Помітити таке майже неможливо: обидва джерела
      # виглядають правильно окремо.
      #
      # База в dev і в проді ОДНА (адреса зашита в
      # assets/js/supabase-client.js), тож знімок спільний. Це не
      # нова зв'язаність, а виправлення напрямку: досі правки з
      # прод-адмінки керували показом і на dev, а правки з
      # dev-адмінки не діяли ніде.
      - name: Оновити знімок залишків у базі
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-stock.js

      # Ціни — щоб база могла перевірити суму замовлення власним
      # еталоном (supabase/migrations/014-order-pricing.sql). Без
      # цього кроку замовлення з dev позначались як «сума не
      # збігається» просто тому, що в базі лежали ціни з
      # попереднього прод-випуску.
      - name: Оновити знімок цін у базі
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-prices.js
