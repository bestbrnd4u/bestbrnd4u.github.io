# Лист «дякуємо за покупку» з персональним промокодом.
#
# НАВІЩО
# -------
# Найдешевший покупець — той, що вже один раз заплатив: він знає
# магазин, отримав річ і переконався, що вона справжня. Після
# «Виконано» магазин із ним більше не говорив ніколи.
#
# ЧОМУ ЧЕРЕЗ МІСЯЦЬ, А НЕ ЧЕРЕЗ ТИЖДЕНЬ
# --------------------------------------
# На сьомий день іде прохання про відгук (request-reviews.yml). Два
# листи поспіль — це вже розсилка, а не увага. Плюс знижка поруч із
# проханням про відгук виглядала б як плата за відгук.
#
# Строк і розмір знижки задаються в адмінці («Листи покупцеві»), а не
# тут: міняти їх мусить власник, а не той, хто вміє правити YAML.
#
# ЧОМУ О 10:00 UTC
# -----------------
# Це приблизно полудень у Києві. Прохання про відгук іде о 9:00 UTC —
# ці два кроки навмисно розведені в часі, щоб у день, коли спрацюють
# обидва, листи не прийшли одночасно.
#
# ЧОМУ НЕ МОЖНА НАДІСЛАТИ ДВІЧІ
# ------------------------------
# Таблиця thankyou_sent пам'ятає, кому вже писали, а позначка
# ставиться ЛИШЕ після успішної відправки (див.
# scripts/send-thankyou.js). Плюс concurrency нижче: два одночасні
# запуски взяли б той самий перелік.
#
# ⚠️ ЗАПРАЦЮЄ ЛИШЕ ПІСЛЯ ПЕРЕНЕСЕННЯ В MAIN
#
# GitHub бере розклад тільки з головної гілки. Поки цей файл лежить у
# dev, крок мовчить. Actions → Sync branches → dev-to-main.

name: Thank you

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: thank-you
  cancel-in-progress: false

jobs:
  thanks:
    runs-on: ubuntu-latest

    steps:
      # Налаштування листа лежать у data/notifications.json — саме
      # тому потрібен checkout, а не просто скрипт.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Без будь-якого з цих секретів крок нічого не робить і
      # завершується успішно — розклад не червонітиме.
      #
      # Так само без міграцій 025/026: скрипт бачить HTTP 404 на
      # thankyou_candidates і спокійно виходить.
      #
      # І без галочки в адмінці: за замовчуванням лист вимкнений, щоб
      # він не почав ходити сам собою після перенесення в main.
      - name: Подякувати за покупку
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
        run: node scripts/send-thankyou.js
