# Налаштування Supabase CLI для цього проєкту.

[functions.telegram-order-bot]

# ОБОВ'ЯЗКОВО false.
#
# За замовчуванням Edge Functions перевіряють JWT у заголовку
# Authorization. Але цю функцію викликають дві сторони, і жодна з них
# JWT не надсилає:
#
#   • Telegram — коли користувач тисне кнопку або пише боту;
#   • сама база — тригером при новому замовленні (через pg_net).
#
# З увімкненою перевіркою Supabase відхиляє такий запрос ще до
# виконання коду (401 Unauthorized), і бот просто мовчить —
# у getWebhookInfo видно last_error_message: "401 Unauthorized".
#
# Безпека від цього не страждає: функція перевіряє власні секрети —
# TELEGRAM_WEBHOOK_SECRET для запитів Telegram і HOOK_SECRET для
# запитів бази. Запит без правильного секрета отримає 403.
verify_jwt = false
